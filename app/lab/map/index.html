<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E22">
<title>地図の試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{--bg:#0B0E22;--panel:#161A3A;--line:#2A3066;--text:#EDEBFF;--sub:#A9A6D6;--gold:#FFC857;--teal:#3ED6C4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic",system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
header h1{font:15px "DotGothic16",monospace;margin:0;flex:1;white-space:nowrap}
header a{color:var(--sub);font-size:12px}
.tabs{display:flex;gap:4px;padding:6px 12px}
.tabs button{flex:1}
button{font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 8px;cursor:pointer}
button.on{background:var(--gold);color:#221a00;border-color:var(--gold);font-weight:700}
section{flex:1;min-height:0;display:none;flex-direction:column}
section.on{display:flex}
.bar{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 6px}
.bar button{white-space:nowrap;padding:6px 9px;font-size:12px}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#10183E}
.stage canvas{display:block;touch-action:none;image-rendering:pixelated}
.dm-where,.dm-perf{position:absolute;left:8px;font:12px "DotGothic16",monospace;background:rgba(11,14,34,.82);padding:3px 7px;border-radius:6px;pointer-events:none;z-index:2}
.dm-where{top:8px;max-width:calc(100% - 70px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-perf{top:34px;color:var(--teal)}
.dm-perf:empty{display:none}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:40px;height:40px;font:20px "DotGothic16",monospace;padding:0}
.legend{position:absolute;left:8px;bottom:22px;display:flex;gap:8px;font-size:11px;background:rgba(11,14,34,.82);padding:3px 8px;border-radius:6px;z-index:2;pointer-events:none}
.legend i{display:inline-block;width:10px;height:10px;margin-right:3px;vertical-align:-1px}
.src{position:absolute;right:0;bottom:0;left:0;font-size:9.5px;line-height:1.3;color:#cfd3f0;background:rgba(11,14,34,.75);padding:2px 6px;z-index:2}
.src a{color:#cfd3f0}
.dm-info,.rm-pop{font-size:13px}
.dm-info{position:absolute;left:8px;right:8px;bottom:44px;background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:10px 12px;z-index:4}
.dm-info b,.rm-pop b{font:15px "DotGothic16",monospace}
.dm-tag{display:inline-block;margin-left:6px;font-size:11px;padding:1px 7px;border-radius:8px;background:#8C93C8;color:#14122E;font-weight:700}
.dm-tag.y{background:var(--gold)}
.dm-sub{color:var(--sub);font-size:12px;margin:4px 0 8px}
.rm-pop .dm-sub{color:#555}
.dm-btns{display:flex;gap:6px}
.dm-btns button{flex:1}
.rm-map{position:absolute;inset:0;background:#dfe3ea}
.rm-pin{background:none;border:0}
.rm-pin img{width:24px;height:27px;image-rendering:pixelated;display:block}
.rm-pix img{image-rendering:pixelated}
.rm-pop button{color:#221a00;background:var(--gold);border-color:var(--gold);width:100%;margin-top:2px}
.leaflet-container{font-family:"Zen Maru Gothic",system-ui,sans-serif}
.leaflet-control-attribution{font-size:10px}
.memo{overflow-y:auto;padding:4px 16px 40px;line-height:1.7;font-size:14px}
.memo h2{font:16px "DotGothic16",monospace;color:var(--gold);margin:18px 0 6px}
.memo ul{padding-left:1.2em;margin:4px 0}
.memo table{border-collapse:collapse;font-size:12px;width:100%}
.memo td,.memo th{border:1px solid var(--line);padding:3px 6px;text-align:left}
.memo .pal{display:flex;flex-wrap:wrap;margin:6px 0}
.memo .pal i{width:20px;height:20px}
.memo small{color:var(--sub)}
</style>
</head>
<body>
<header><h1>地図の試作</h1><a href="../../">アプリへ</a></header>
<div class="tabs"><button data-tab="a" class="on">A ドットの地図</button><button data-tab="b">B 本物の地図</button><button data-tab="m">わかったこと</button></div>

<section id="a" class="on">
  <div class="bar"><button data-go="jp">日本</button><button data-go="kanto">関東</button><button data-go="kana">神奈川</button><button data-go="spot">名所のまわり</button></div>
  <div class="stage">
    <canvas aria-label="ドットの日本地図。指でずらす・2本の指で拡大縮小。印を押すと名前が出ます"></canvas>
    <div class="dm-where">読み込み中…</div><div class="dm-perf"></div>
    <div class="zoom"><button data-z="1" aria-label="拡大">＋</button><button data-z="-1" aria-label="縮小">−</button></div>
    <div class="legend"><span><i style="background:#FFC857"></i>行った</span><span><i style="background:#8C93C8"></i>まだ</span><span><i style="background:#D2A458"></i>行った市区町村</span></div>
    <div class="dm-info" hidden></div>
    <div class="src">地図：「国土数値情報（行政区域・鉄道）」（国土交通省, CC BY 4.0）と Natural Earth を加工して作成</div>
  </div>
</section>

<section id="b">
  <div class="bar"><button data-rgo="jp">日本</button><button data-rgo="kanto">関東</button><button data-rgo="kana">神奈川</button><button data-rgo="spot">みなとみらい</button>
    <button data-base="pale" class="on">地理院</button><button data-base="osm">OSM</button><button data-dot>ドット風</button></div>
  <div class="stage"><div class="rm-map"></div></div>
</section>

<section id="m"><div class="memo" id="memo"></div></section>

<script src="vendor/leaflet.js"></script>
<script type="module" src="lab.js"></script>
</body>
</html>
