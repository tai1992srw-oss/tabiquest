<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E22">
<title>スタイルの比べる場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E22;--panel:#161A3A;--line:#2A3066;--text:#EDEBFF;--sub:#A9A6D6;--gold:#FFC857;--teal:#3ED6C4;--coral:#FF6B5A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic",system-ui,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
header h1{font:16px "DotGothic16",monospace;margin:0;flex:1}
header a{color:var(--sub);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px}
select,button{font:inherit;font-size:14px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
button.on{background:var(--gold);color:#221a00;border-color:var(--gold);font-weight:700}
.stage{padding:0 16px;display:grid;gap:10px}
.stage.one{grid-template-columns:1fr;max-width:480px;margin:0 auto}
.stage.grid{grid-template-columns:1fr 1fr}
@media (min-width:900px){.stage.grid{grid-template-columns:repeat(4,1fr)}}
.cell{position:relative;background:#05060f;border:2px solid transparent;border-radius:10px;overflow:hidden;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell.act{border-color:var(--gold)}
.cell canvas{image-rendering:pixelated;display:block}
.cell .tag{position:absolute;left:6px;top:6px;font:12px "DotGothic16",monospace;background:rgba(11,14,34,.8);padding:2px 6px;border-radius:6px;max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(11,14,34,.5);font:13px "DotGothic16",monospace}
.cell.busy .busy{display:flex}
.pal{display:flex;flex-wrap:wrap;gap:0;margin:8px 16px 0;border-radius:6px;overflow:hidden}
.pal i{width:14px;height:14px;display:block}
.panel{margin:12px 16px 32px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.panel h2{font:15px "DotGothic16",monospace;margin:0 0 8px;color:var(--gold)}
.row{display:grid;grid-template-columns:7.5em 1fr 3.5em;align-items:center;gap:8px;margin:10px 0}
.row label{font-size:13px;color:var(--sub)}
.row output{font:13px "DotGothic16",monospace;text-align:right}
input[type=range]{width:100%;accent-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 10px;font-size:13px}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin:8px 0 0}
textarea{width:100%;height:90px;font:12px monospace;background:#0B0E22;color:var(--text);border:1px solid var(--line);border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<header><h1>スタイルの比べる場</h1><a href="../../">アプリへ</a></header>
<div class="bar">
  <select id="sample" aria-label="元の絵"></select>
  <button id="vOne">1枚</button><button id="vGrid">4つ並べる</button>
</div>
<div class="stage" id="stage"></div>
<div class="pal" id="pal" aria-label="いまの色"></div>
<div class="panel" id="panel"></div>
<script type="module" src="style.js"></script>
</body>
</html>
